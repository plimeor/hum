[package]
name = "hum"
version = "0.1.0-rc.4"
edition = "2024"
description = "Run background commands as launchd services, configured by TOML files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/plimeor/hum"
homepage = "https://github.com/plimeor/hum"
rust-version = "1.88"
publish = false

[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
libc = "0.2.191"
plist = "1.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"
toml_edit = "0.25.17"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

