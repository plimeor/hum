[package]
name = "hum"
version = "0.1.0"
edition = "2024"
description = "Run background commands as launchd services, configured by TOML files"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
libc = "0.2.191"
plist = "1.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"
toml_edit = "0.25.17"

