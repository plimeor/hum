[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "plimeor/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Publish prerelease versions to the tap too
publish-prereleases = true
# release.yml is generated by dist and then edited by hand: the
# publish-homebrew-formula job commits to the tap as
# GITHUB_USER "Plimeor" / GITHUB_EMAIL "plimeor@gmail.com". After
# upgrading dist or changing installers, publish-jobs or tap, remove
# allow-dirty, run `dist generate`, reapply that edit, and restore it.
allow-dirty = ["ci"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
